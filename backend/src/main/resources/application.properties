server.address=127.0.0.1
server.port=${SW_BACKEND_PORT:8080}
spring.datasource.url=${SW_DB_URL:jdbc:postgresql://127.0.0.1:55439/smartwater}
spring.datasource.username=smartwater
spring.datasource.password=${SW_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.jackson.time-zone=UTC
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=64KB
spring.mvc.log-request-details=false

spring.jackson.deserialization.fail-on-unknown-properties=true
